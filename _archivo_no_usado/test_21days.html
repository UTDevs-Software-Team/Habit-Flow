<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow 21 Días - Suite de Verificación Automatizada (3 Calendarios)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6 sm:p-10 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
      <h1 class="text-2xl font-bold text-slate-900 mb-1">🧪 HabitFlow 21 Días — Suite de Verificación (3 Calendarios)</h1>
      <p class="text-sm text-slate-500">Pruebas unitarias para validar la calibración de lapsos según la magnitud del hábito (Chico, Mediano, Grande).</p>
    </div>

    <div id="results" class="space-y-3"></div>

    <div class="p-4 bg-white rounded-2xl border border-slate-200 flex items-center justify-between">
      <div id="summary" class="font-bold text-sm text-slate-700">Ejecutando pruebas...</div>
      <button onclick="runAllTests()" class="px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl hover:bg-indigo-700">
        Re-ejecutar Pruebas
      </button>
    </div>
  </div>

  <script>
    const tests = [];
    function test(name, fn) {
      tests.push({ name, fn });
    }

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Fallo de aserción');
    }

    // --- TEST SUITE DEFINITIONS ---

    test('1. Definición de los 3 Calendarios (Chico, Mediano, Grande)', () => {
      const durations = {
        chico:   [2, 3, 3, 3, 3, 4, 2,  5, 3,  5,  5,  5,  8, 3,  5,  4, 3, 10,  5, 3, 3],
        mediano: [5, 5, 5, 5, 5, 7, 3,  8, 5, 10,  8, 10, 18, 5, 10,  5, 5, 23, 10, 5, 5],
        grande:  [5, 7, 8, 6, 8, 10, 5, 12, 8, 15, 12, 15, 25, 7, 15, 10, 8, 30, 15, 8, 8]
      };

      assert(durations.chico.length === 21, 'Calendario Chico tiene 21 días');
      assert(durations.mediano.length === 21, 'Calendario Mediano tiene 21 días');
      assert(durations.grande.length === 21, 'Calendario Grande tiene 21 días');

      // Check sum of planned minutes
      const sumChico = durations.chico.reduce((a, b) => a + b, 0);
      const sumMediano = durations.mediano.reduce((a, b) => a + b, 0);
      const sumGrande = durations.grande.reduce((a, b) => a + b, 0);

      assert(sumChico < sumMediano, 'Chico acumula menos tiempo que Mediano');
      assert(sumMediano < sumGrande, 'Mediano acumula menos tiempo que Grande');
    });

    test('2. Condicionamiento de Tiempos en Día 1', () => {
      const getD1Duration = (mag) => mag === 'chico' ? 2 : 5;
      assert(getD1Duration('chico') === 2, 'Día 1 para Ordenar cuarto es de 2 min');
      assert(getD1Duration('mediano') === 5, 'Día 1 para Lectura es de 5 min');
      assert(getD1Duration('grande') === 5, 'Día 1 para Estudio complejo es de 5 min (fricción cero)');
    });

    test('3. Condicionamiento de Secuencias Multi-Bloque (Día 13)', () => {
      const getD13Sequence = (mag) => {
        if (mag === 'chico') return [{ m: 4 }, { m: 1 }, { m: 3 }];
        if (mag === 'grande') return [{ m: 15 }, { m: 3 }, { m: 7 }];
        return [{ m: 10 }, { m: 3 }, { m: 5 }];
      };

      const sChico = getD13Sequence('chico').reduce((acc, p) => acc + p.m, 0);
      const sMediano = getD13Sequence('mediano').reduce((acc, p) => acc + p.m, 0);
      const sGrande = getD13Sequence('grande').reduce((acc, p) => acc + p.m, 0);

      assert(sChico === 8, 'Día 13 Chico dura 8 min en total');
      assert(sMediano === 18, 'Día 13 Mediano dura 18 min en total');
      assert(sGrande === 25, 'Día 13 Grande dura 25 min en total');
    });

    test('4. Regla de Desbloqueo Secuencial Estricto', () => {
      const isLocked = (day, completed) => day === 1 ? false : !completed.includes(day - 1);
      assert(isLocked(1, []) === false, 'Día 1 accesible');
      assert(isLocked(2, []) === true, 'Día 2 bloqueado');
      assert(isLocked(2, [1]) === false, 'Día 2 desbloqueado tras Día 1');
    });

    test('5. Planta Virtual y Fases', () => {
      const getPhase = (completed) => {
        if (completed <= 3) return 1;
        if (completed <= 7) return 2;
        if (completed <= 14) return 3;
        if (completed <= 20) return 4;
        return 5;
      };

      assert(getPhase(0) === 1, 'Fase 1 Semilla');
      assert(getPhase(4) === 2, 'Fase 2 Brote');
      assert(getPhase(8) === 3, 'Fase 3 Tallo');
      assert(getPhase(15) === 4, 'Fase 4 Floración');
      assert(getPhase(21) === 5, 'Fase 5 Árbol Maduro');
    });

    function runAllTests() {
      const container = document.getElementById('results');
      container.innerHTML = '';
      let passed = 0;

      tests.forEach(({ name, fn }) => {
        const div = document.createElement('div');
        div.className = 'p-4 rounded-xl border flex items-center justify-between ';
        try {
          fn();
          passed++;
          div.className += 'bg-emerald-50 border-emerald-200 text-emerald-900';
          div.innerHTML = `<span class="font-semibold text-xs sm:text-sm">✓ ${name}</span><span class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">PASÓ</span>`;
        } catch (err) {
          div.className += 'bg-rose-50 border-rose-200 text-rose-900';
          div.innerHTML = `<span class="font-semibold text-xs sm:text-sm">✗ ${name}: ${err.message}</span><span class="text-xs font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800">FALLÓ</span>`;
        }
        container.appendChild(div);
      });

      const summary = document.getElementById('summary');
      summary.textContent = `Resultado: ${passed} de ${tests.length} pruebas pasadas con éxito (${Math.round((passed / tests.length) * 100)}%).`;
    }

    runAllTests();
  </script>
</body>
</html>
